<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>75 Tracker ✨</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="sparkles">✦ ✧ ✦</p>
        <h1>75 Tracker Club</h1>
        <p class="subtitle">Cute accountability for your 75 day challenge</p>
        <p id="teamCounter" class="team-counter"></p>
      </header>

      <section>
        <h2>Team Members</h2>
        <div id="memberCards" class="member-grid"></div>
      </section>

      <section class="add-member-wrap">
        <h2>Add New Challenger</h2>
        <form id="addMemberForm" class="add-member-form">
          <input id="newMemberName" type="text" placeholder="Name or nickname" required />
          <input id="newMemberAvatar" type="text" value="🐣" maxlength="2" aria-label="Avatar emoji" />
          <button type="submit" class="success">Add member</button>
        </form>
      </section>

      <section>
        <h2>Daily Task Board</h2>
        <p class="small-note">Check off tasks as you complete them. Tasks auto-refresh at 4am daily.</p>
        <div class="board-wrap">
          <table id="taskBoard" class="task-board"></table>
        </div>
      </section>

      <section class="observer-card">
        <h2>Caitlyn the Cheerleader 🐱</h2>
        <p class="small-note">Tap for encouragement from the sidelines.</p>
        <button id="cheerButton" class="alt" type="button">Send encouragement + confetti</button>
        <div id="confettiZone" class="confetti-zone" aria-hidden="true"></div>
      </section>
    </main>

    <script src="src/trackerState.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
